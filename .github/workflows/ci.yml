name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # sadr: cooldown exception CVE-2026-105481, CVE-2026-105482, CVE-2026-105483, CVE-2026-106069, CVE-2026-106072, CVE-2026-106073, CVE-2026-106074, CVE-2026-111497, lift when 24.22.1 clears the cooldown
          node-version: 24.22.1
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # The suite runs inside workerd via @cloudflare/vitest-plugin, so it
      # needs no Cloudflare account and no secrets. Deploy is deliberately not
      # wired up here: it would need an API token with write access to the
      # account, and this repo is public.
      - name: Test
        run: npm test
