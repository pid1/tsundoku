<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin - tsundoku</title>
<link rel="stylesheet" href="/app.css">
<link rel="icon" href="/logo.svg" type="image/svg+xml">
</head>
<body>
<main>
  <h1>Administration</h1>
  <div id="msg" class="msg" hidden></div>

  <div class="panel">
    <h2 style="margin-top:0">Storage</h2>
    <div class="meter"><i id="meter"></i></div>
    <p class="muted" id="usage" style="font-size:0.85rem"></p>
    <p class="muted" id="counts" style="font-size:0.85rem;margin-bottom:0"></p>
  </div>

  <h2>Users</h2>
  <div class="panel">
    <table class="stack">
      <thead><tr><th>Username</th><th>Name</th><th>Role</th><th>Status</th><th></th></tr></thead>
      <tbody id="users"></tbody>
    </table>

    <h2>Add a user</h2>
    <form id="newUser">
      <div class="row">
        <div class="field"><label for="n-username">Username</label><input id="n-username" type="text" required></div>
        <div class="field"><label for="n-name">Display name</label><input id="n-name" type="text"></div>
        <div class="field">
          <label for="n-role">Role</label>
          <select id="n-role"><option value="reader">Reader</option><option value="admin">Administrator</option></select>
        </div>
      </div>
      <p class="muted" style="font-size:var(--text-xs)">
        A high-entropy password is generated and shown once. It is never stored in
        recoverable form, so write it down before closing the message.
      </p>
      <button type="submit">Create user</button>
    </form>
  </div>
  <h2 id="sync">Reading sync</h2>
  <p class="muted">Where each device has got to in each book, and which devices disagree.</p>
  <div id="sync-msg" class="msg" hidden></div>
  <div class="toolbar">
    <select id="sync-user" hidden aria-label="Filter by user"></select>
    <select id="sync-status" aria-label="Filter by sync status">
      <option value="all">All books</option>
      <option value="diverged">Out of sync</option>
      <option value="in-sync">In sync</option>
      <option value="single">One device only</option>
    </select>
    <button class="secondary" id="sync-refresh">Refresh</button>
  </div>
  <p class="muted" id="sync-count" style="font-size:var(--text-sm)"></p>
  <div id="sync-list"></div>
</main>

<script type="module">
import { api, el, formatBytes, formatDate, mountChrome, showMessage } from "/app.js";

await mountChrome();

async function loadStats() {
  const s = await api("/api/stats");
  const fraction = Math.min(1, s.r2UsedFraction);
  document.getElementById("meter").style.width = `${(fraction * 100).toFixed(1)}%`;
  document.getElementById("usage").textContent =
    `${formatBytes(s.bytes)} of ${formatBytes(s.r2FreeTierBytes)} R2 free tier (${(fraction * 100).toFixed(1)}%)`;
  document.getElementById("counts").textContent =
    `${s.books} books, ${s.authors} authors, ${s.series} series, ${s.tags} subjects, ${s.users} users` +
    (s.unindexed ? `, ${s.unindexed} awaiting metadata` : "");
}

async function loadUsers() {
  const { users } = await api("/api/users");
  const body = document.getElementById("users");
  body.replaceChildren(
    ...users.map((user) =>
      el(
        "tr",
        {},
        el("td", { class: "mono", "data-label": "Username", text: user.username }),
        el("td", { "data-label": "Name", text: user.display_name || "" }),
        el("td", { "data-label": "Role" }, el("span", { class: "pill", text: user.role })),
        el("td", { "data-label": "Status", text: user.disabled ? "disabled" : `since ${formatDate(user.created_at)}` }),
        el(
          "td",
          {},
          el(
            "div",
            { class: "actions" },
            el("button", {
              class: "secondary",
              text: "Reset password",
              onclick: () => resetPassword(user),
            }),
            el("button", {
              class: "secondary",
              text: user.disabled ? "Enable" : "Disable",
              onclick: () => setDisabled(user, !user.disabled),
            }),
            el("button", { class: "danger", text: "Delete", onclick: () => remove(user) }),
          ),
        ),
      ),
    ),
  );
}

async function resetPassword(user) {
  if (!confirm(`Issue a new password for ${user.username}? Their current one stops working immediately.`)) return;
  const result = await api(`/api/users/${user.id}`, { method: "PATCH", body: JSON.stringify({ generatePassword: true }) });
  showMessage("msg", `New password for ${user.username}: ${result.password} - write it down, it is not shown again.`, "ok");
}

async function setDisabled(user, disabled) {
  await api(`/api/users/${user.id}`, { method: "PATCH", body: JSON.stringify({ disabled }) });
  await loadUsers();
}

async function remove(user) {
  if (!confirm(`Delete ${user.username}? Their reading progress goes with them.`)) return;
  try {
    await api(`/api/users/${user.id}`, { method: "DELETE" });
    await loadUsers();
    await loadStats();
  } catch (error) {
    showMessage("msg", error.message);
  }
}

document.getElementById("newUser").addEventListener("submit", async (event) => {
  event.preventDefault();
  showMessage("msg", "");
  try {
    const result = await api("/api/users", {
      method: "POST",
      body: JSON.stringify({
        username: document.getElementById("n-username").value.trim(),
        displayName: document.getElementById("n-name").value.trim() || null,
        role: document.getElementById("n-role").value,
      }),
    });
    showMessage("msg", `Created ${result.username}. Password: ${result.password} - write it down, it is not shown again.`, "ok");
    event.target.reset();
    await loadUsers();
    await loadStats();
  } catch (error) {
    showMessage("msg", error.message);
  }
});

/* --------------------------------- sync --------------------------------- */

const listNode = document.getElementById("sync-list");
const countNode = document.getElementById("sync-count");
const userSelect = document.getElementById("sync-user");
const statusSelect = document.getElementById("sync-status");

// The server decides what this account may see; these are only the view's
// own filters over whatever came back.
let books = [];

const STATUS_LABEL = {
  "in-sync": "In sync",
  diverged: "Out of sync",
  single: "One device",
};

function relative(seconds) {
  if (!seconds) return "never";
  const delta = Math.floor(Date.now() / 1000) - seconds;
  if (delta < 90) return "just now";
  if (delta < 3600) return `${Math.floor(delta / 60)} min ago`;
  if (delta < 172800) return `${Math.floor(delta / 3600)} hr ago`;
  return formatDate(seconds);
}

function deviceRow(device, book) {
  return el(
    "div",
    { class: "device" },
    el(
      "div",
      { class: "device-head" },
      el("strong", { text: device.device }),
      device.isFurthest ? el("span", { class: "pill ok", text: "furthest" }) : null,
      device.isLatest && !device.isFurthest ? el("span", { class: "pill", text: "most recent push" }) : null,
      !device.isFurthest && book.status === "diverged"
        ? el("span", { class: "pill warn", text: `${(device.behindBy * 100).toFixed(1)}% behind` })
        : null,
    ),
    el("div", { class: "meter" }, el("i", { style: `width:${Math.round(device.percentage * 100)}%` })),
    el(
      "p",
      { class: "muted device-meta" },
      `${device.percentLabel} - ${relative(device.updatedAt)}`,
      device.progress ? el("span", { class: "mono device-pos", text: device.progress }) : null,
    ),
  );
}

function bookCard(book) {
  return el(
    "section",
    { class: "panel sync-book" },
    el(
      "div",
      { class: "sync-head" },
      el(
        "div",
        {},
        el("h2", { text: book.title }),
        el(
          "p",
          { class: "muted sync-sub" },
          el("span", { class: "pill", text: book.userLabel }),
          book.format ? el("span", { class: "pill", text: book.format.toUpperCase() }) : null,
          el("span", {
            class: `pill ${book.status === "in-sync" ? "ok" : book.status === "diverged" ? "warn" : ""}`,
            text: STATUS_LABEL[book.status],
          }),
          el("span", { class: "pill", text: `${book.deviceCount} device${book.deviceCount === 1 ? "" : "s"}` }),
          book.unmatched ? el("span", { class: "pill warn", text: "not in library" }) : null,
        ),
      ),
      el(
        "div",
        { class: "sync-furthest" },
        el("strong", { text: book.furthestLabel }),
        el("span", { class: "muted", text: "furthest" }),
      ),
    ),
    book.bookId
      ? el("p", { class: "sync-link" }, el("a", { href: `/library.html#${book.bookId}`, text: "Open in library" }))
      : el("p", { class: "muted sync-link mono", text: book.document }),
    el("div", { class: "devices" }, book.devices.map((d) => deviceRow(d, book))),
  );
}

function render() {
  const wanted = statusSelect.value;
  const shown = wanted === "all" ? books : books.filter((b) => b.status === wanted);

  listNode.replaceChildren(...shown.map(bookCard));

  if (books.length === 0) {
    countNode.textContent = "No reading positions yet. They appear once a device syncs.";
  } else {
    const diverged = books.filter((b) => b.status === "diverged").length;
    countNode.textContent =
      `${shown.length} of ${books.length} book${books.length === 1 ? "" : "s"}` +
      (diverged ? ` - ${diverged} out of sync` : "");
  }
}

async function load() {
  showMessage("sync-msg", "");
  try {
    const params = new URLSearchParams();
    if (userSelect.value) params.set("sync-user", userSelect.value);
    const data = await api(`/api/sync${params.toString() ? `?${params}` : ""}`);

    books = data.books;

    // The filter exists only for an account allowed to look past itself.
    if (data.scope.canFilter && data.users.length > 0) {
      const keep = userSelect.value;
      userSelect.replaceChildren(
        el("option", { value: "", text: "All users" }),
        ...data.users.map((u) => el("option", { value: u.id, text: u.label })),
      );
      userSelect.value = keep;
      userSelect.hidden = false;
    }
    render();
  } catch (error) {
    showMessage("sync-msg", error.message);
  }
}

userSelect.addEventListener("change", load);
statusSelect.addEventListener("change", render);
document.getElementById("sync-refresh").addEventListener("click", load);

await loadStats();
await loadUsers();
await load();

// The users table and sync list fill in after the browser has already tried
// the #sync fragment (old /sync links land here), so jump once they exist.
if (location.hash) document.getElementById(location.hash.slice(1))?.scrollIntoView();
</script>
</body>
</html>
